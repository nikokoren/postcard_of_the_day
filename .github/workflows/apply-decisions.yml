name: Apply Review Decisions

# The comment on the reminder issue is the whole handover: a person
# reviews the queue, presses "Hand over decisions", and pastes the block
# here. This reads it, writes curation.json, rebuilds the feed and
# pushes -- so a pass costs a copy and a paste rather than a
# conversation.
#
# Only the repository owner is listened to. This path turns text from a
# comment box into what a plugin serves, and apply_decisions.py refuses
# anything it does not fully understand, but the first gate is who is
# speaking.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  # To hand the rewrite workflow its cue. A push made with the default
  # token never starts another workflow -- GitHub's rule, to stop a
  # workflow looping on its own commits -- so the chain from a flag to a
  # rewritten caption has to be asked for, not waited for.
  actions: write

concurrency:
  group: apply-decisions
  cancel-in-progress: false

jobs:
  apply:
    # Deliberately not conditioned on the issue being open. It used to
    # be, and that turned a paste into silence: the standing issue
    # carried the same label the reminder uses to find its own, the
    # reminder closed it when the runway recovered, and every block
    # pasted there afterwards was skipped -- no run, no log, no reply.
    # Who is speaking is the gate that matters.
    if: >-
      contains(github.event.comment.body, '```queue') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Install the image libraries
        run: pip install --quiet pillow numpy

      - name: Fold the decisions in
        id: apply
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -o pipefail
          printf '%s' "$BODY" | python3 apply_decisions.py \
            > summary.txt 2> problem.txt || {
              {
                echo "I could not apply that block."
                echo
                echo '```'
                cat problem.txt
                echo '```'
              } > reply.md
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the feed
        if: steps.apply.outputs.ok == 'true'
        run: python3 daily.py

      - name: Check it still holds together
        if: steps.apply.outputs.ok == 'true'
        # Not piped into tee: the step shell is bash -e without pipefail,
        # so a pipe would report tee's exit status and a failing selftest
        # would pass the gate -- the opposite of this step's whole job.
        run: |
          python3 daily.py --selftest > selftest.txt 2>&1 || {
            cat selftest.txt
            exit 1
          }
          cat selftest.txt

      - name: Push
        if: steps.apply.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A ':!summary.txt' ':!problem.txt' ':!reply.md' ':!selftest.txt'
          if git diff --staged --quiet; then
            echo "Nothing changed." > reply.md
            exit 0
          fi
          git commit -m "Apply review decisions: $(cat summary.txt)"
          for attempt in 1 2 3; do
            git push && break
            git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
            sleep $((attempt * 5))
          done
          {
            echo "Applied: $(cat summary.txt)"
            echo
            echo "The feed is rebuilt and pushed. Anything vetoed is out of"
            echo "the schedule; anything flagged now shows the archive's own"
            echo "words instead of the translation."
          } > reply.md

      # The cue the push cannot give. rewrite-captions.yml listens for a
      # change to flagged_text.json, and in five weeks it never once
      # heard one: every run it has ever had was started by hand.
      - name: Ask for the flagged captions to be rewritten
        if: steps.apply.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          waiting="$(python3 pending_rewrites.py --brief | sed -n 's/^pending=//p')"
          if [ "${waiting:-0}" = "0" ]; then
            echo "No caption is waiting for a replacement."
            exit 0
          fi
          echo "$waiting caption(s) waiting; starting the rewrite workflow."
          if gh workflow run rewrite-captions.yml --ref "$GITHUB_REF_NAME"; then
            echo "" >> reply.md
            echo "$waiting flagged caption(s) are being rewritten; a pull" >> reply.md
            echo "request with the replacements follows." >> reply.md
          else
            echo "::warning::could not start the rewrite workflow; $waiting"\
                 "caption(s) are still waiting"
            echo "" >> reply.md
            echo "$waiting flagged caption(s) are waiting for a replacement," >> reply.md
            echo "but the rewrite workflow could not be started from here." >> reply.md
          fi

      # always(), because the interesting case is the one that failed.
      # Without it a failing step skips this one, and a review that was
      # folded in, rebuilt, then refused by the selftest goes back to its
      # author as nothing at all. Six reviews went that way.
      - name: Say what happened
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ ! -s reply.md ]; then
            {
              echo "That block was read and the decisions were applied, but"
              echo "the run did not finish, so **nothing was saved**."
              echo
              echo "The checks that run before anything is pushed did not pass:"
              echo
              echo '```'
              sed -n 's/^.*FAIL/FAIL/p' selftest.txt 2>/dev/null | head -20 \
                || echo "see the run log"
              echo '```'
              echo
              echo "Nothing is lost -- paste the same block again once that is"
              echo "fixed. [The run]($RUN)"
            } > reply.md
          fi
          gh issue comment "${{ github.event.issue.number }}" --body-file reply.md
