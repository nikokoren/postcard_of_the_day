name: Rewrite Flagged Captions

# The other half of a text flag.
#
# Flagging drops a bad translation so the archive's own words come back.
# Where there was never a translation it changes nothing a reader sees --
# the caption is already the archive's words, and they are the problem.
# Either way the repair is a line somebody writes by hand, and until this
# existed nothing asked for one: flagged_text.json was written and never
# read, and eight captions sat in it for a fortnight.
#
# So: when a flag lands, work out what the translator got wrong and write
# the replacement into corrections.json. As a pull request, not a push --
# a veto is the owner's own judgement going straight in, but a caption is
# invented prose going onto somebody's wall, and that is worth a glance.
#
# Inert until the repository has a Claude credential. Without one the job
# says what is waiting and stops, so adding the secret later is the only
# step needed to bring it to life.

on:
  push:
    branches: [main]
    paths: ["flagged_text.json"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: rewrite-captions
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: What is waiting
        id: waiting
        run: python3 pending_rewrites.py --brief >> "$GITHUB_OUTPUT"

      - name: Say what it is
        if: steps.waiting.outputs.pending != '0'
        run: python3 pending_rewrites.py --task

      # secrets cannot be read in an `if:`, so the gate goes through a step.
      - name: Is there a credential to run with
        id: gate
        env:
          HAVE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: echo "ready=$HAVE" >> "$GITHUB_OUTPUT"

      - name: Nothing to run with
        if: steps.waiting.outputs.pending != '0' && steps.gate.outputs.ready != 'true'
        run: |
          echo "::notice::${{ steps.waiting.outputs.pending }} caption(s) need a"\
               "replacement, but this repository has no CLAUDE_CODE_OAUTH_TOKEN"\
               "or ANTHROPIC_API_KEY secret, so there is nothing to write them."\
               "Install the Claude GitHub App and add the secret; this workflow"\
               "then runs on the next flag with no further change."

      - name: Write the corrections
        if: steps.waiting.outputs.pending != '0' && steps.gate.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without these the run has no hands. A plain-text prompt gets
          # no shell and no file access until they are granted, and the
          # first attempt proved what that looks like: three turns, two
          # permission denials, and a green tick for having done nothing.
          claude_args: |
            --max-turns 30
            --allowedTools Read,Edit,Write,Bash,Glob,Grep
          prompt: |
            Run `python3 pending_rewrites.py` in the repository root. It
            lists flagged captions that have no replacement written yet.

            For each one, work out what the translator actually got wrong,
            then write the caption that should have been there into
            corrections.json, keyed by the item's id:

              "<id>": {
                "was":   "<the caption pool.json currently holds, exactly>",
                "title": "<your replacement, in English>",
                "note":  "<what was wrong, for whoever reads this next>"
              }

            Rules that matter here:

            - "was" must match pool.json's caption for that id character
              for character. daily.py drops a correction whose "was" has
              drifted, and the selftest fails on it, so a careless copy is
              worse than no correction.
            - Keep proper names as names. A place, a building, a person or
              a restaurant is not vocabulary -- this whole mechanism exists
              because a translator rendered Antietam as "Antimony" and
              Nafplio as "Napple".
            - Where a caption was never translated, the archive's own words
              are the source. Translate them properly; do not paraphrase,
              and do not invent detail the caption does not carry.
            - Say in "note" what the fault was, specifically. "Mistranslated"
              helps nobody; "debouquemens is an 18th-century naval term for
              the channels out of the Antilles, half-copied into deboutmen"
              is the kind of thing that stops it happening again.

            Then run `python3 daily.py --selftest` and make sure it passes.
            It checks that every correction still matches the caption it
            corrects and actually reaches the panel.

            Change corrections.json and nothing else. Do not commit, do not
            push, and do not open a pull request -- the workflow does that
            with whatever you leave in the working tree.

      # Deliberately not Claude's job. Opening the pull request is
      # mechanical, and leaving it to the prompt means it depends on which
      # tools the run happened to be granted; here it either works or
      # fails loudly. It also bounds the blast radius: whatever else the
      # run touched on disk, only corrections.json can reach the branch.
      - name: Open a pull request with what changed
        if: steps.waiting.outputs.pending != '0' && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING: ${{ steps.waiting.outputs.pending }}
        run: |
          set -euo pipefail
          stray="$(git status --porcelain -- . ':!corrections.json')"
          if [ -n "$stray" ]; then
            echo "::warning::files other than corrections.json were touched and"\
                 "will not be included:"
            echo "$stray"
          fi
          if git diff --quiet -- corrections.json; then
            echo "::warning::the run left corrections.json unchanged;"\
                 "$PENDING caption(s) are still waiting"
            exit 0
          fi
          branch="rewrite-captions-${GITHUB_RUN_ID}"
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git checkout -b "$branch"
          git add corrections.json
          git commit -m "Rewrite $PENDING flagged postcard caption(s)"
          # Push with a credential of our own. actions/checkout stores one,
          # but the Claude action revokes its app token as its last step and
          # that leaves the stored credential dead -- the first attempt got
          # "Password authentication is not supported" after committing
          # perfectly good work. Inline, so nothing is persisted in config.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                   "HEAD:refs/heads/$branch"
          {
            echo "Replacements for the captions flagged as wrong."
            echo
            echo '```diff'
            git diff origin/main...HEAD -- corrections.json
            echo '```'
            echo
            echo "Each entry carries the fault it fixes in its note. Merging"
            echo "puts these on the panel from day three onward -- a published"
            echo "day keeps the caption it was published with."
          } > body.md
          gh pr create --title "Rewrite $PENDING flagged postcard caption(s)" \
                       --body-file body.md --base main --head "$branch"
