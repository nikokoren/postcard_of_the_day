name: Postcard of the Day

on:
  schedule:
    # 00:05 UTC. The card changes at this moment for every device. The
    # picks are computed offline from the committed pool, so this job
    # does not depend on any archive being up.
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-postcard
  cancel-in-progress: false

jobs:
  pick-postcard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Enough history to rebase onto a push that landed while this
          # job was running, without cloning the whole daily history.
          fetch-depth: 20

      - name: Install the image libraries
        run: pip install --quiet pillow numpy

      - name: Check the picture filter still agrees with our eyes
        run: python3 score.py --selftest

      - name: Score a batch of cards for whether they read on a panel
        # Cards on their way to a screen first, so a bad one is caught
        # before anybody sees it rather than after. Budgeted, cached
        # forever, and a failure here must not cost the day's picks --
        # an unscored card is kept, which is the old behaviour.
        continue-on-error: true
        run: python3 score.py --budget 1200 --upcoming 21

      - name: Pick today's postcard
        run: python3 daily.py

      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add postcard.json today.json quality.json

          if git diff --staged --quiet; then
            echo "Same postcard as the last run, nothing to commit"
          else
            git commit -m "Update postcard of the day [$(date -u +'%Y-%m-%d')]"
            # A rejected push means the other workflow committed while
            # this job was running, not that anything is wrong. Rebase
            # and retry rather than failing the run.
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed."
                exit 0
              fi
              echo "Push rejected, rebasing on origin (attempt $attempt)"
              git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
              sleep $((attempt * 5))
            done
            echo "Could not push after 3 attempts"
            exit 1
          fi
