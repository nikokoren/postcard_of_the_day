name: Refresh Postcard Pool

on:
  schedule:
    # 03:40 UTC on the 1st. The pool is a cache of catalogue metadata;
    # it only needs refreshing when a collection grows, a scan is
    # withdrawn, or there is more of the pool left to measure.
    - cron: "40 3 1 * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Max search pages per source (100 records each)"
        required: false
        default: "400"
      # A newly added source arrives in whatever slice of the shared
      # measurement budget it can win, and an unmeasured card is
      # dropped. These two exist so a first pass can be spent on one
      # source rather than waiting months for it to come round.
      dims_source:
        description: "Spend the whole measurement budget on one source (e.g. onb)"
        required: false
        default: ""
      dims_budget:
        description: "info.json lookups this run (default 2500)"
        required: false
        default: ""
      only:
        description: "Harvest only these sources, comma separated (e.g. onb-akon). Others keep their current cards."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-postcard-pool
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Install Pillow, and the offline translator
        run: pip install --quiet pillow numpy argostranslate langdetect

      # Before the crawl, not after: these are the rules that decide
      # what the crawl is allowed to do to the pool, and an hour of
      # paging is a long time to find out one of them is broken.
      - name: Check the rate-limit, shrink and resume rules
        run: python3 harvest.py --selftest

      - name: Harvest the postcard pool
        # EUROPEANA_KEY is a repository secret, never a file in the repo.
        # Without it the Europeana source skips itself and the rest of
        # the harvest runs exactly as before, so a fork works unchanged.
        env:
          EUROPEANA_KEY: ${{ secrets.EUROPEANA_KEY }}
          DIMS_SOURCE: ${{ github.event.inputs.dims_source }}
          DIMS_BUDGET: ${{ github.event.inputs.dims_budget }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python3 harvest.py \
            --pages "${{ github.event.inputs.pages || 400 }}" \
            ${DIMS_SOURCE:+--dims-source "$DIMS_SOURCE"} \
            ${DIMS_BUDGET:+--dims-budget "$DIMS_BUDGET"} \
            ${ONLY:+--only "$ONLY"}

      - name: Put more captions into English
        # Offline, no key. Budgeted and cached forever, so each refresh
        # covers more of the pool; a failure here must not cost the
        # harvest, which is the expensive part.
        continue-on-error: true
        run: python3 translate.py --budget 5000

      - name: Check every job still reads the score cache the same way
        # harvest.py, score.py and daily.py all touch quality.json. When
        # they disagreed about which key held the rows, this job wrote a
        # file the next step died on, and harvest re-measured a cache it
        # had already filled.
        run: python3 test_quality_cache.py

      - name: Prove the schedule still behaves
        run: python3 daily.py --selftest

      - name: Check the picture filter still agrees with our eyes
        run: python3 score.py --selftest

      - name: Check the captions still split where they should
        run: python3 translate.py --selftest

      - name: Regenerate the plugin settings
        run: python3 make_settings.py

      - name: Rebuild today's picks against the new pool
        run: python3 daily.py

      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          # The outputs must exist -- if today.json is missing, the run
          # did not do its job and should say so.
          git add pool.json postcard.json today.json trmnl/settings.yml

          # The caches are added only if they are there. Not every run
          # writes every one: `--only onb-akon` never runs a paged crawl,
          # so crawl.json does not exist, and `git add` on an absent path
          # exits 128. That killed a successful run on 2 November after
          # it had measured eight thousand cards -- the pool was built,
          # today.json was written, and the commit step fell over naming
          # a file the run had no reason to produce.
          for cache in crawl.json quality.json dimensions.json \
                       geonames.json translations.json; do
            [ -f "$cache" ] && git add "$cache"
          done

          if git diff --staged --quiet; then
            echo "Pool unchanged, nothing to commit"
          else
            git commit -m "Refresh postcard pool [$(date -u +'%Y-%m-%d')]"
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed."
                exit 0
              fi
              echo "Push rejected, rebasing on origin (attempt $attempt)"
              git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
              sleep $((attempt * 5))
            done
            echo "Could not push after 3 attempts"
            exit 1
          fi

      # A run that fails still did real work: pages walked, captions
      # translated, dimensions measured. Those caches are what lets the
      # next run carry on instead of starting over and failing again
      # for the same reason. Saved even when the run fails, and the run
      # stays red.
      #
      # Last in the job, not next to the harvest. It used to sit after
      # the harvest step, which meant it was skipped on the one run
      # where it would have mattered most: the harvest succeeded, the
      # commit step failed, and eight thousand measurements went with
      # it. A backstop belongs after the thing it is backing up.
      #
      # cancelled() as well as failure(), because a job killed at its
      # timeout is cancelled rather than failed.
      - name: Keep whatever progress the run made
        if: failure() || cancelled()
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          # Only what is there. This step runs because something went
          # wrong, and the thing that went wrong may be the reason a
          # file is missing -- a `git add` on an absent path exits 1 and
          # would turn a saved-what-we-could step into a second failure.
          for cache in crawl.json dimensions.json geonames.json \
                       translations.json quality.json; do
            [ -f "$cache" ] && git add "$cache"
          done
          if git diff --staged --quiet; then
            echo "No progress to keep"
          else
            git commit -m "Keep harvest progress from a refused run [$(date -u +'%Y-%m-%d')]"
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed."
                exit 0
              fi
              git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
              sleep $((attempt * 5))
            done
            echo "Could not push the progress"
            exit 1
          fi
