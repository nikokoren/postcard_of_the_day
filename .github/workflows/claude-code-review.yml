name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # A pull request carrying nothing but caption corrections is not
    # reviewable code, and the job below already declines to review the
    # ones rewrite-captions.yml opens. Declining it here instead means
    # no run is created at all. That matters: GitHub cannot start a
    # workflow from a pull_request event raised with GITHUB_TOKEN, so
    # every such run was recorded and then killed before it could read
    # the condition below -- twenty red runs that never ran a step and
    # never left a log, which read as if the rewrites were failing.
    paths-ignore:
      - corrections.json

jobs:
  claude-review:
    # Skip the pull requests Claude opened itself. rewrite-captions.yml
    # branches are named rewrite-captions-<run id> and carry a few lines
    # of corrections.json, written by a Claude run minutes earlier --
    # reviewing them means paying a second time for a second opinion on
    # the same work, from the same source, about a file whose only real
    # check is whether a person agrees with the caption.
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'rewrite-captions-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

