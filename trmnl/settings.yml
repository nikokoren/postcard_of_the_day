---
# Postcard of the Day -- TRMNL plugin settings
#
# Generated by make_settings.py from pool.json. The country list tracks
# whatever the archives actually hold, so it changes when the pool is
# refreshed; regenerate rather than editing by hand.
#
# Nothing selected on any of the three axes means the full catalogue.
# That is deliberate and the recipe depends on it: a reader who never
# opens the settings panel still gets a postcard every morning.

name: Postcard of the Day
refresh_interval: 60
strategy: polling
polling_verb: get
polling_url: https://raw.githubusercontent.com/nikokoren/postcard_of_the_day/main/today.json
dark_mode: "no"
no_screen_padding: "no"

custom_fields:
  - keyname: orientation
    field_type: select
    name: Orientation
    description: Leave empty for both. Pick one to see only cards that way up.
    optional: true
    multiple: true
    options:
      - Landscape
      - Portrait
  - keyname: region
    field_type: select
    name: Region
    description: Leave empty for everywhere. Pick several and they take turns.
    optional: true
    multiple: true
    options:
      - Europe
      - North America
      - Africa
      - Latin America & the Caribbean
      - Asia
      - Middle East
  - keyname: era
    field_type: select
    name: Era
    description: When it was printed. Leave empty for every era.
    optional: true
    multiple: true
    options:
      - Before 1900
      - 1900 - 1914
      - 1915 - 1929
      - 1930 - 1945
      - 1946 onwards
  - keyname: show_caption
    field_type: select
    name: Show the caption
    description: The card's own title, and its date.
    optional: true
    default: "true"
    options:
      - true
      - false
  - keyname: show_place
    field_type: select
    name: Show the place
    description: Where the card is from, under the title.
    optional: true
    default: "true"
    options:
      - true
      - false
  - keyname: show_credit
    field_type: select
    name: Show the credit
    description: The holding archive and collection.
    optional: true
    default: "false"
    options:
      - true
      - false
  - keyname: about
    name: About This Plugin
    category: education,discovery
    field_type: author_bio
    description: >-
      Miss getting postcards in the mail? This recipe has you covered. A
      unique historical postcard from across the globe. Each and every day.
      No friends and family required. <br><br> Real printed cards from the
      public archives -- the kind somebody bought at a station kiosk, wrote
      three lines on, and posted. 18,206 of them so far, spanning
      115 countries and the years 1860 to 1975, held by the
      Library of Congress, the Rijksmuseum, the University of Graz and
      more. Each one arrives with whatever the catalogue knows: what it
      shows, where, who printed it, and when. <br><br> Sort by orientation, region or era -- or change
      nothing and take the whole world as it comes. No card repeats until
      every one of them has had its day. <br><br> Public domain and openly
      licensed material only. Install (don't Fork!) to receive future
      updates.
    email_address: isarworks@gmail.com
