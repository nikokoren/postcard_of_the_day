---
# Postcard of the Day -- TRMNL plugin settings
#
# Generated by make_settings.py from pool.json. The country list tracks
# whatever the archives actually hold, so it changes when the pool is
# refreshed; regenerate rather than editing by hand.
#
# Nothing selected on any of the three axes means the full catalogue.
# That is deliberate and the recipe depends on it: a reader who never
# opens the settings panel still gets a postcard every morning.

name: Postcard of the Day
refresh_interval: 60
strategy: polling
polling_verb: get
polling_url: https://raw.githubusercontent.com/nikokoren/postcard_of_the_day/main/today.json
dark_mode: "no"
no_screen_padding: "no"

custom_fields:
  - keyname: orientation
    field_type: select
    name: Orientation
    description: Leave empty for both. Pick one to see only cards that way up.
    optional: true
    multiple: true
    options:
      - Landscape
      - Portrait
  - keyname: region
    field_type: select
    name: Region
    description: Leave empty for everywhere. Pick several and they take turns.
    optional: true
    multiple: true
    options:
      - North America
      - Europe
      - Africa
      - Latin America & the Caribbean
      - Asia
      - Middle East
  - keyname: era
    field_type: select
    name: Era
    description: When it was printed. Leave empty for every era.
    optional: true
    multiple: true
    options:
      - Before 1900
      - 1900 - 1914
      - 1915 - 1929
      - 1930 - 1945
      - 1946 onwards
  - keyname: show_caption
    field_type: select
    name: Show the caption
    description: The card's own title, and its date.
    optional: true
    default: "true"
    options:
      - true
      - false
  - keyname: show_place
    field_type: select
    name: Show the place
    description: Where the card is from, under the title.
    optional: true
    default: "true"
    options:
      - true
      - false
  - keyname: show_credit
    field_type: select
    name: Show the credit
    description: The holding archive and collection.
    optional: true
    default: "false"
    options:
      - true
      - false

author_bio: >-
  A postcard a day from the public archives -- a real printed card, the
  kind somebody bought at a station kiosk, wrote three lines on and
  posted. Every morning the recipe picks one from about 15,307 of them,
  drawn from the Library of Congress and Digital Commonwealth, and shows
  it with whatever the catalogue knows: what it shows, where, who
  printed it and when. Sort by orientation, region or era, or leave the
  settings alone and take the whole catalogue as it comes. Nothing
  repeats until every card has had its day. Public domain and openly
  licensed material only.
